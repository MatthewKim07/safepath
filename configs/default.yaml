paths:
  raw_dir: data/raw
  page_cache_dir: data/raw/pages
  processed_dir: data/processed
  reports_dir: reports
  figures_dir: reports/figures

download:
  url: https://services.arcgis.com/S9th0jAJ7bqgIRjw/ArcGIS/rest/services/Traffic_Collisions_Open_Data/FeatureServer/0/query
  page_size: 2000
  timeout_seconds: 60
  max_retries: 6
  backoff_seconds: 2.0
  workers: 4

clean:
  # Generous box around the City of Toronto; anything outside is treated as bad geocoding.
  bbox:
    min_lon: -79.65
    max_lon: -79.10
    min_lat: 43.57
    max_lat: 43.87

graph:
  place: Toronto, Ontario, Canada
  network_type: drive
  crs: EPSG:32617
  # OSMnx buffer radius: intersection nodes within 2x this distance merge into one.
  # 10 m fits TPS points best; 20 m merges distinct intersections (reports/location_analysis.md).
  consolidation_tolerance_m: 10
  tolerance_candidates_m: [10, 15, 20]

snap:
  # Chosen from reports/location_analysis.md: crash points sit a median ~2 m from an
  # intersection; 99% of crashes are within 6.4 m of a drivable edge.
  intersection_m: 30
  edge_m: 20

splits:
  train: [2016, 2017, 2018, 2019, 2022, 2023]
  val: [2024]
  test: [2025]
  # 2014-2015 and 2020-2021 are history only; 2026 is partial and dropped.

proxies:
  # Computed from train label years only. Tuning notes in reports/labels.md.
  retail:
    min_train_crashes: 150
    max_severe_share: 0.08
    min_ftr_share: 0.25
    max_dist_retail_m: 150
  expressway:
    max_dist_motorway_m: 200
    min_train_crashes: 150
    min_ratio_to_combo_median: 20
