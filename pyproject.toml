[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safepath"
version = "0.1.0"
description = "Crash-risk-aware routing: a learned segment risk model with a fastest-to-safest trade-off."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Matthew Kim" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "requests>=2.31",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "geopandas>=0.14",
    "shapely>=2.0",
    "networkx>=3.2",
    "osmnx>=1.9",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "streamlit>=1.32",
    "folium>=0.16",
    "streamlit-folium>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "playwright>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
